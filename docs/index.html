<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Integrity Village</title>
    <meta
      name="description"
      content="Integrity Village. Obtain max scores in all 6 stages to win an integrity cap."
    />
    <meta name="theme-color" content="#08080c" />
    <link rel="canonical" href="https://honesty.mkweli.tech/" />
    <meta property="og:title" content="Integrity Village" />
    <meta property="og:description" content="Two competitions: renovations, then a whistle-blower brief on dive master Ravi." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://honesty.mkweli.tech/" />
    <meta property="og:image" content="https://honesty.mkweli.tech/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://honesty.mkweli.tech/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=vg12" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="village" aria-label="Holographic village map"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <div id="boot" class="overlay">
      <div class="panel boot-card">
        <div class="lang-row">
          <div class="lang-switch" id="boot-lang"></div>
        </div>
        <h1 id="boot-title">Integrity Village</h1>
        <p class="lede" id="boot-goal"></p>
        <ol class="stages" id="boot-stages"></ol>
        <p class="kicker mute" id="boot-choose">Choose your character</p>
        <div class="class-list two" id="class-list">
          <button type="button" class="class-btn" data-id="kuzin"><span class="class-name">Kuzin</span></button>
          <button type="button" class="class-btn" data-id="cheri"><span class="class-name">Cheri</span></button>
          <button type="button" class="class-btn" data-id="malin"><span class="class-name">Malin</span></button>
          <button type="button" class="class-btn" data-id="kokin"><span class="class-name">Kokin</span></button>
        </div>
        <button type="button" class="cta" id="enter-btn" disabled>Enter</button>
      </div>
    </div>

    <div id="play" class="hud" hidden>
      <header class="panel header">
        <div class="mobile-tools">
          <p class="qcount" id="qcount">0/12</p>
          <div class="lang-switch" id="play-lang-mobile"></div>
        </div>
        <div class="header-row">
          <div>
            <p class="kicker cyan" id="phase-kicker">Project phase</p>
            <p class="title" id="phase-title">Village Infrastructure Overhaul</p>
          </div>
          <div class="comp-switch" id="comp-switch">
            <button type="button" data-comp="tender" class="on">Tenders</button>
            <button type="button" data-comp="whistle">Whistle</button>
          </div>
          <div class="stat hide-sm">
            <p class="kicker mute" id="playing-kicker">Playing as</p>
            <p class="mono cyan" id="stat-name">—</p>
          </div>
          <div class="stat">
            <p class="kicker mute" id="stat-label">Contracts won</p>
            <p class="mono green" id="stat-won">0/8</p>
          </div>
          <button type="button" class="reset-btn" id="reset-btn">Reset</button>
          <div class="lang-switch desk-lang" id="play-lang"></div>
        </div>
        <div class="chips" id="contractor-chips"></div>
      </header>

      <section class="panel side left" id="tender-panel" aria-label="Infrastructure tender"></section>
      <section class="panel side right" id="board-panel" aria-label="Contractor leaderboard"></section>
      <div class="dock" id="house-dock" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <nav class="tabs" id="mobile-tabs">
        <button type="button" data-tab="tender" class="on" id="tab-case">Tender</button>
        <button type="button" data-tab="grid" id="tab-grid">Grid</button>
        <button type="button" id="tab-round">Whistle</button>
        <button type="button" id="tab-reset">Reset</button>
      </nav>
    </div>

    <div id="outcome" class="overlay" hidden>
      <div class="panel boot-card" id="outcome-card">
        <p class="kicker" id="outcome-kicker"></p>
        <h2 id="outcome-title"></h2>
        <p class="lede" id="outcome-body"></p>
        <p class="mono mute" id="outcome-score"></p>
        <button type="button" class="cta" id="outcome-dismiss">Watch the grid</button>
      </div>
    </div>

    <footer class="foot">
      <a href="https://mkweli.tech">A Mkweli product</a>
      <span id="foot-note">Six stages. Not a court.</span>
    </footer>

    <script type="module" src="./app.js?v=vg12"></script>
  </body>
</html>
